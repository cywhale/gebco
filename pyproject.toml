[project]
name = "gebco-api"
version = "0.5.3"
description = "Production runtime for the GEBCO bathymetry FastAPI service."
requires-python = ">=3.11,<3.12"
dependencies = [
    "dask[complete]==2025.3.0",
    "distributed==2025.3.0",
    "fastapi[standard]==0.115.12",
    "geopy==2.4.1",
    "gunicorn==23.0.0",
    "numcodecs==0.15.1",
    "numpy==1.26.4",
    "orjson==3.10.16",
    "pyarrow==19.0.1",
    "python-dotenv==1.1.0",
    # pyproj is the v0.5.4 H9 fast-distance backend (74x faster than
    # geopy.geodesic per call, byte-equal numerical output via the same
    # WGS84/Karney geographiclib internals). See src/zprofile._seg_km.
    "pyproj>=3.6,<4",
    "requests==2.32.3",
    "setuptools==78.1.0",
    "shapely==2.0.7",
    "uvicorn==0.34.0",
    "xarray==2025.3.1",
    "zarr==2.18.6",
]

[tool.uv]
package = false

# v0.5.3 hardening: unit tests for src/ legacy modules live in top-level tests/.
# Run with `uv run --group dev pytest tests/ -q` (after the polars wheel is
# installed via scripts/install_polars_variant.sh on Linux production targets).
[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-mock>=3.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
